name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/12wqa/test-invoice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version rules: app/buildInfo.js is the single source of truth, sw.js line 1 must match
      # (that line change is what makes phones pick up a new version), and a version is never reused.
      - name: Read and check version
        id: v
        run: |
          V=$(grep -oP "version:\s*'\Kv[0-9]+(\.[0-9]+)?" app/buildInfo.js)
          SW=$(head -1 app/sw.js | grep -oP "^// app \Kv[0-9]+(\.[0-9]+)?")
          echo "buildInfo.js: $V   sw.js line 1: $SW"
          if [ -z "$V" ] || [ "$V" != "$SW" ]; then
            echo "::error::buildInfo.js version ($V) and sw.js line 1 ($SW) must match"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to reuse a version
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.v.outputs.version }} already exists - bump the version in app/buildInfo.js and sw.js line 1"; exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}

      - name: Summary
        run: |
          echo "### Published ${{ env.IMAGE }}:${{ steps.v.outputs.version }} (and :latest)" >> "$GITHUB_STEP_SUMMARY"
          echo "On Unraid: Docker tab -> Check for Updates -> apply update on test-invoice." >> "$GITHUB_STEP_SUMMARY"
